# ★ 이 파일은 템플릿이다. 실제 값은 절대 커밋하지 않는다 (README 배포).
#
# 클러스터에 만들 때 (값은 각자 환경에서):
#   kubectl create secret generic rai-secret -n skala-gj4 \
#     --from-literal=POSTGRES_PASSWORD='...' \
#     --from-literal=JWT_SECRET='...'          # ★ 32바이트 이상 (HS256)
#
# OPENAI_API_KEY 는 ai-service 가 붙을 때 추가한다. 지금은 참조하는 곳이 없어서
# 넣어도 쓰이지 않고, 없는 키를 매니페스트가 참조하면 파드가 기동하지 못한다.
#
# harbor-cred(이미지 pull)는 클러스터에 이미 존재하므로 만들지 않는다.
apiVersion: v1
kind: Secret
metadata:
  name: rai-secret
  labels:
    app.kubernetes.io/part-of: rai
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<채워넣기>"
  JWT_SECRET: "<채워넣기 — 32바이트 이상>"
