# frontend (:80) — Vue 정적 자산 + nginx. nginx 가 /api 를 gateway 로 넘긴다.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rai-frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: rai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/part-of: rai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: rai
    spec:
      # ★ 끄지 않으면 쿠버네티스가 네임스페이스의 Service 마다 환경변수를 주입한다
      #   (Service 'kafka' → KAFKA_PORT=tcp://10.x.x.x:9092, KAFKA_SERVICE_HOST=... 등).
      #   cp-kafka 의 설정 스크립트는 KAFKA_* 를 전부 브로커 설정으로 읽어 기동에 실패한다.
      #   같은 사고가 postgres/gateway 이름에서도 날 수 있어 전 파드에 끈다. DNS 해석은 그대로다.
      enableServiceLinks: false
      imagePullSecrets:
        - name: harbor-cred
      containers:
        - name: frontend
          image: harbor.skala-gj.com/skala-gj4/rai-frontend:__TAG__
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 10m,  memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: rai
spec:
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: rai
  ports:
    - port: 80
      targetPort: 80
