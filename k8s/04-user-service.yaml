# user-service (:8081)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rai-user-service
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: rai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
      app.kubernetes.io/part-of: rai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
        app.kubernetes.io/part-of: rai
    spec:
      # ★ 끄지 않으면 쿠버네티스가 네임스페이스의 Service 마다 환경변수를 주입한다
      #   (Service 'kafka' → KAFKA_PORT=tcp://10.x.x.x:9092, KAFKA_SERVICE_HOST=... 등).
      #   cp-kafka 의 설정 스크립트는 KAFKA_* 를 전부 브로커 설정으로 읽어 기동에 실패한다.
      #   같은 사고가 postgres/gateway 이름에서도 날 수 있어 전 파드에 끈다. DNS 해석은 그대로다.
      enableServiceLinks: false
      imagePullSecrets:
        - name: harbor-cred          # 클러스터에 이미 존재하는 시크릿
      initContainers:
        # ddl-auto: validate 라 DB 가 없으면 즉시 죽는다. 재시작 루프로도 결국 뜨지만
        # 데모 중 RESTARTS 가 쌓여 보이므로 여기서 기다린다.
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo "waiting for postgres"; sleep 2; done']
      containers:
        - name: user-service
          image: harbor.skala-gj.com/skala-gj4/rai-user-service:__TAG__
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            # ★ 없으면 JVM 이 컨테이너 limit 을 못 보고 힙을 크게 잡아 OOMKilled 가 난다.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=65"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/rai_db    # Service 이름
            - name: SPRING_DATASOURCE_USERNAME
              value: rai
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: rai-secret, key: POSTGRES_PASSWORD }
            # ★ gateway 와 반드시 같은 값 (없으면 토큰 검증이 전부 실패한다)
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: rai-secret, key: JWT_SECRET }
          readinessProbe:
            tcpSocket: { port: 8081 }      # actuator 미포함 모듈이라 tcpSocket 을 쓴다
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8081 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: rai
spec:
  selector:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: rai
  ports:
    - port: 8081
      targetPort: 8081
