# backend (:8090)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rai-backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: rai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/part-of: rai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: rai
    spec:
      imagePullSecrets:
        - name: harbor-cred          # 클러스터에 이미 존재하는 시크릿
      initContainers:
        # ddl-auto: validate 라 DB 가 없으면 즉시 죽는다. 재시작 루프로도 결국 뜨지만
        # 데모 중 RESTARTS 가 쌓여 보이므로 여기서 기다린다.
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo "waiting for postgres"; sleep 2; done']
      containers:
        - name: backend
          image: harbor.skala-gj.com/skala-gj4/rai-backend:__TAG__
          ports:
            - containerPort: 8090
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            # ★ 없으면 JVM 이 컨테이너 limit 을 못 보고 힙을 크게 잡아 OOMKilled 가 난다.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=65"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/rai_db    # Service 이름
            - name: SPRING_DATASOURCE_USERNAME
              value: rai
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: rai-secret, key: POSTGRES_PASSWORD }
          readinessProbe:
            tcpSocket: { port: 8090 }      # actuator 미포함 모듈이라 tcpSocket 을 쓴다
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8090 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: rai
spec:
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: rai
  ports:
    - port: 8090
      targetPort: 8090
