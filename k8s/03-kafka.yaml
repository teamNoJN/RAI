# kafka — KRaft 단일 브로커 (ZooKeeper 없음).
#
# ★ 현재 producer/consumer 코드는 없다. 판정은 chat-service 의 @Async 워커가 처리한다.
#   이벤트 코드가 붙을 자리를 미리 확보해 두는 것이고, 그래서 저장소도 emptyDir 로 둔다.
#   실제 이벤트가 흐르기 시작하면 PVC 로 바꾼다.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rai-kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: rai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/part-of: rai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: rai
    spec:
      # ★ 끄지 않으면 쿠버네티스가 네임스페이스의 Service 마다 환경변수를 주입한다
      #   (Service 'kafka' → KAFKA_PORT=tcp://10.x.x.x:9092, KAFKA_SERVICE_HOST=... 등).
      #   cp-kafka 의 설정 스크립트는 KAFKA_* 를 전부 브로커 설정으로 읽어 기동에 실패한다.
      #   같은 사고가 postgres/gateway 이름에서도 날 수 있어 전 파드에 끈다. DNS 해석은 그대로다.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.7.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
            # ★ Service 이름이어야 다른 파드의 컨슈머가 붙는다.
            #   여기가 localhost 면 컨슈머가 조용히 아무것도 못 받는다 (계획서 트러블슈팅).
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits:   { cpu: 500m, memory: 1Gi }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: rai
spec:
  selector:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: rai
  ports:
    - port: 9092
      targetPort: 9092
