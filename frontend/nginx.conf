# frontend 컨테이너의 nginx — SPA 정적 서빙 + /api 를 gateway 로 전달.
#
# 이 프록시 덕분에 브라우저 입장에서 화면과 API 가 같은 도메인이 되어 CORS 가 아예 발생하지 않는다
# (README 프론트엔드 — 배포 시 Nginx 가 FE 와 /api 를 같은 도메인으로 서빙한다).
# Ingress 에 /api 규칙을 두지 않는 이유도 이것이다. 진입점이 하나로 유지된다.
server {
  listen 80;
  server_name _;

  location /api/ {
    # ★ 규제 PDF 업로드(/api/regulations)가 이 경로를 지난다. nginx 기본값 1MB 로는
    #   공식 규제 문서 대부분이 413 으로 잘린다 (예: BPOM 24/2017 은 3.3MB).
    #   백엔드 spring.servlet.multipart 가 50MB 라 같은 값으로 맞춘다.
    client_max_body_size 50m;

    # K8s Service 이름. Compose 컨테이너명과 같아서 환경별 분기가 없다 (README 설계 근거).
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 판정·보고서 생성은 폴링 구조지만, 업스트림이 느릴 때 502 로 끊기지 않게 여유를 준다.
    proxy_read_timeout 60s;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;   # Vue Router 새로고침 대응
  }
}
