# chat-service (:8083) — 대화 세션 · 메시지
server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: rai-chat-service
  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://postgres:5432/rai_db
    username: rai
    password: rai-dev-1
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 init-db/01_schema.sql 이 소유
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    # 명세의 필드 집합을 고정한다. 값이 없으면 키를 빼지 않고 null 로 내려야
    # FE 가 키 존재를 가정할 수 있다 (예: last_message_at).
    property-naming-strategy: SNAKE_CASE

rai:
  jwt:
    # Gateway 가 앞에 없을 때 Bearer 토큰을 직접 검증하는 데 쓴다. user-service 와 같은 값.
    secret: ${JWT_SECRET:rai-local-dev-secret-key-change-me-32bytes+}
  services:
    drug-url: ${DRUG_SERVICE_URL:http://drug-service:8082}
    # 규제 KB. ai-service 분리 시 이 값만 바꾼다.
    regulation-url: ${REGULATION_SERVICE_URL:http://backend:8090}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
